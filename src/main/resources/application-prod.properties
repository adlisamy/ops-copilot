# Prod profile configuration
# Disables SpringDoc OpenAPI/Swagger UI in production to avoid
# exposing API surface and keep the production environment clean.

# Disable the Swagger UI page
springdoc.swagger-ui.enabled=false

# Disable the OpenAPI JSON endpoint
springdoc.api-docs.enabled=false

# Restrict package scanning to only the public-facing API
springdoc.packages-to-scan=com.opscopilot.api
springdoc.paths-to-match=/api/**
