# Identifies this service in Spring Boot logs and Actuator metadata.
spring.application.name=ops-copilot
spring.profiles.active=dev
# Local development port; use a different value when this port is already occupied.
server.port=18080

# Exposes only the health and info management endpoints over HTTP.
management.endpoints.web.exposure.include=health,info
# Enables /actuator/health/liveness and /actuator/health/readiness for future container probes.
management.endpoint.health.probes.enabled=true

# Values exposed by the Actuator info endpoint.
info.app.name=Ops Copilot
info.app.description=Safe, production-minded AI operations assistant

# Limits generated OpenAPI documentation to the public API package and /api routes.
springdoc.packages-to-scan=com.opscopilot.api
springdoc.paths-to-match=/api/**

# AI Model configuration; these values are overridden by environment variables in production.
# You can override it with a different model name
