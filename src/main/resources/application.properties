# Identifies this service in Spring Boot logs and Actuator metadata.
spring.application.name=ops-copilot
spring.profiles.active=dev
# Local development port; use a different value when this port is already occupied.
server.port=18080
# Logging

# Exposes only the health and info management endpoints over HTTP.
management.endpoints.web.exposure.include=health,info
# Enables /actuator/health/liveness and /actuator/health/readiness for future container probes.
management.endpoint.health.probes.enabled=true

# Values exposed by the Actuator info endpoint.
info.app.name=Ops Copilot
info.app.description=Safe, production-minded AI operations assistant

# Limits generated OpenAPI documentation to the public API package and /api routes.
springdoc.packages-to-scan=com.opscopilot.api
springdoc.paths-to-match=/api/**

# AI Provider configuration
# Options: ollama (local), openai-compatible (cloud), anthropic (cloud)
# See README.md "Choosing a Model" section for details

# --- Option 1: Ollama (local, free, privacy-first) ---
app.ai.provider=ollama
app.ai.ollama.model=llama3
app.ai.ollama.base-url=http://localhost:11434

# --- Gemini chat reference (inactive; keep credentials in the environment) ---
# To use hosted Gemini chat, set GEMINI_API_KEY and select the openai provider.
#app.ai.provider=openai
#app.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
#app.ai.openai.api-key=${GEMINI_API_KEY}
#app.ai.openai.model=gemini-3.8-flash

# --- Option 3: Anthropic (cloud, requires API key) ---
#spring.config.activate.on-profile: anthropic
#app.ai.provider=anthropic
#app.ai.anthropic.model=claude-sonnet-4-20250514
#app.ai.anthropic.base-url=https://api.anthropic.com/v1
#app.ai.anthropic.apiKey=${ANTHROPIC_API_KEY:your-api-key-here}
spring.autoconfigure.exclude=\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration,\
  org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration,\
  org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration

# MCP Server configuration
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=ops-copilot
spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp