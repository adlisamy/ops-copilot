# Dev profile configuration
# Enables SpringDoc OpenAPI/Swagger UI in development so the team can
# explore and test the API endpoints interactively.

# Enable the Swagger UI page
springdoc.swagger-ui.enabled=true

# Enable the OpenAPI JSON endpoint
springdoc.api-docs.enabled=true

# RAG storage and local Ollama embeddings. Use the same embedding model for ingestion and search;
# its output dimension must match the pgvector column.
spring.datasource.url=jdbc:postgresql://localhost:5431/ops_vector_db
spring.datasource.username=app
spring.datasource.password=${OPS_COPILOT_DB_PASSWORD}

spring.ai.model.embedding.text=ollama
spring.ai.ollama.base-url=${app.ai.ollama.base-url}
spring.ai.ollama.embedding.model=nomic-embed-text

# Gemini embedding reference (inactive). Add the Spring AI Google GenAI embedding starter before
# selecting this provider; keep GEMINI_API_KEY outside the repository.
#spring.ai.model.embedding.text=google-genai
#spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
#spring.ai.google.genai.embedding.text.model=gemini-embedding-001
#spring.ai.google.genai.embedding.text.dimensions=768

# The operational knowledge base is intentionally limited to the curated runbooks.
app.knowledge-base.docs-path=docs/runbooks
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.schema-name=ops
spring.ai.vectorstore.pgvector.distance-type=cosine_distance
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.max-document-batch-size=1000
spring.ai.vectorstore.pgvector.index-type=hnsw